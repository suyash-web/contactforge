[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contactforge"
version = "1.0.0"
description = "MuJoCo-based physics asset validation and numerical contact reliability toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = []
dependencies = [
    "mujoco>=3.17,<4",
    "numpy>=2.0,<3",
    "trimesh>=5,<6",
    "scipy>=1.15,<2",
    "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
contactforge = "contactforge.cli:main"

[tool.setuptools]
include-package-data = true
packages = [
    "contactforge",
    "contactforge.assets",
    "contactforge.diagnostics",
    "contactforge.reporting",
    "contactforge.simulation",
    "experiments",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
